name: GitHub Pages

on:
  push:
    branches:
      - main  # デフォルトのブランチ名に合わせてください

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # ここで書き込み権限を設定
      pages: write      # GitHub Pagesへの書き込み権限

    steps:
    - name: Install tree
      run: sudo apt-get install tree

    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.0 # 使用しているRubyのバージョンに合わせてください

    - name: Install dependencies
      run: |
        gem install bundler
        bundle install

    - name: Build Jekyll site
      run: |
        jekyll build --trace
        echo "Contents of _site:"
        tree _site
        ls -al _site

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./_site
        force: true  # 強制的に再デプロイ

