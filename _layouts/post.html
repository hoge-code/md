---
layout: default
---
    <article>
      <header>
        <h1>{{ page.title }}</h1>
        <p class="meta">
          {{ page.date | date: "%B %d, %Y" }} 
          <!--
          in
          <a href="/category/{{ page.categories[0] | slugify }}"
            >{{ page.categories[0] }}</a
          >
        -->
        </p>
      </header>

      <div class="content">{{ content }}</div>

      <footer>
        <p>
          Tags: {% for tag in page.tags %}
          <a href="/md/tag/{{ tag | slugify }}">{{ tag }}</a>{% if forloop.last ==
          false %}, {% endif %} {% endfor %}
        </p>
      </footer>
    </article>
